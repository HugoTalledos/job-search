# Configuración del agente de búsqueda de empleo.
# Los valores ${VAR} se toman de variables de entorno (secrets en GitHub Actions).

# Hoja de vida base: Markdown (recomendado), .txt o .pdf
resume_path: resume/base.md

# Repositorios que el agente analiza para inferir tu perfil.
github_user: HugoTalledos      # lista tus repos públicos (y privados si REPO_READ_TOKEN tiene acceso)
include_forks: false
max_repos: 15
repositories: []               # repos adicionales en cualquier remoto git, p. ej.:
#  - url: https://gitlab.com/usuario/proyecto.git
#  - url: https://github.com/HugoTalledos/otro-repo.git
#    branch: main

# Re-inferir el perfil como máximo cada N días (también se rehace si cambian el CV o los repos).
profile_refresh_days: 7

search:
  # 1) Plan de búsqueda (determinista): palabras clave × ubicaciones.
  #    Palabras clave = extra_keywords + los primeros cargos objetivo de tu perfil + sus keywords.
  locations: ["Remote", "Colombia"]
  extra_keywords: []
  max_roles_from_profile: 3
  max_queries: 8                 # máximo de búsquedas por corrida (cada una es una búsqueda en LinkedIn)

  # 2) Filtros que aplica LinkedIn en la propia búsqueda.
  posted_within_days: 1          # con 3 corridas al día, 1 día da solapamiento suficiente
  work_types: []                 # remote, hybrid, on_site  (vacío = cualquiera)
  experience_levels: []          # internship, entry, associate, mid_senior, director, executive

  # 3) Filtros deterministas del agente, antes de llamar a Claude.
  #    (además: ids ya vistos, duplicados por empresa+cargo normalizados, publicaciones antiguas)
  exclude_companies: []          # se comparan normalizados: "Acme Inc." = "ACME"
  exclude_title_keywords: []     # p. ej. ["intern", "practicante", "lead"]

  # 4) Presupuestos por corrida.
  max_details_per_run: 40        # ofertas nuevas cuyo detalle se descarga de LinkedIn
  max_jobs_per_run: 25           # ofertas que Claude evalúa (solo las que pasaron los filtros)

  sources:
    linkedin:
      enabled: true
      command: uvx
      args: ["mcp-server-linkedin@latest"]
      env:
        UV_HTTP_TIMEOUT: "300"
      max_pages: 2               # páginas de resultados por búsqueda (1-10)

matching:
  min_score_to_notify: 70   # notificar ofertas con afinidad >= 70/100
  min_score_to_tailor: 70   # crear CV ajustado si además el CV actual no te hace justicia

# Reutilizar hojas de vida ya ajustadas (output/**/version.json) cuando una oferta nueva es parecida.
# Solo se consideran versiones creadas a partir de tu resume/base.md actual: si lo cambias, se generan nuevas.
resume_reuse:
  enabled: true
  max_candidates: 20        # versiones más recientes que se le muestran al selector
