name: job-search

on:
  schedule:
    # 3 veces al día. Cron en UTC: 12:07, 17:07 y 22:07 UTC = 7:07, 12:07 y 17:07 en Colombia (UTC-5).
    - cron: "7 12,17,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No enviar notificaciones"
        type: boolean
        default: false
      rebuild_profile:
        description: "Forzar re-inferir el perfil"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Latest head of the branch, not the commit that triggered the run: a run queued behind another
      # must see the data/state.json the previous one pushed, or it would notify the same postings again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: astral-sh/setup-uv@v6   # provee uvx para lanzar servidores MCP

      - name: Dependencias del sistema (PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Restaurar sesión de LinkedIn MCP
        env:
          LINKEDIN_SESSION_B64: ${{ secrets.LINKEDIN_SESSION_B64 }}
        if: env.LINKEDIN_SESSION_B64 != ''
        # Generado con scripts/export_linkedin_session.py: solo cookies.json + source-state.json (pocos KB).
        # En el runner el servidor reconstruye una sesión de navegador nueva a partir de las cookies.
        run: |
          echo "$LINKEDIN_SESSION_B64" | base64 -d | tar -xz -C "$HOME"
          chmod -R go-rwx "$HOME/.linkedin-mcp"
          if [ ! -s "$HOME/.linkedin-mcp/cookies.json" ] || [ ! -s "$HOME/.linkedin-mcp/source-state.json" ]; then
            echo "::error::LINKEDIN_SESSION_B64 no contiene cookies.json y source-state.json; genéralo con scripts/export_linkedin_session.py"
            exit 1
          fi
          echo "Sesión de LinkedIn restaurada ($(wc -c < "$HOME/.linkedin-mcp/cookies.json") bytes de cookies)"

      - name: Re-inferir perfil
        if: inputs.rebuild_profile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: python -m job_agent profile --force > /dev/null

      - name: Buscar, filtrar, ajustar CV y notificar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: python -m job_agent run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Guardar estado, perfil y CVs generados
        if: always()
        run: |
          git config user.name "job-search-bot"
          git config user.email "job-search-bot@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(job-search): resultados $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push falló (intento $attempt); reintentando..."
            sleep $((attempt * 5))
          done
          echo "::error::No se pudo guardar el estado; la próxima corrida podría repetir notificaciones"
          exit 1
